<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Pinkoc 二周年生日</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0b1120 0%, #19233c 50%, #2b1f3a 100%);
            background-attachment: fixed;
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, 'Roboto', 'Helvetica Neue', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            top: -25%;
            left: -25%;
            background: radial-gradient(circle at 30% 40%, rgba(120, 80, 220, 0.2), rgba(0, 0, 0, 0) 70%);
            pointer-events: none;
            animation: slowRotate 30s infinite alternate;
        }

        @keyframes slowRotate {
            0% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 0.6; }
            100% { transform: translate(5%, 5%) rotate(2deg) scale(1.05); opacity: 1; }
        }

        .countdown-card {
            position: relative;
            z-index: 10;
            max-width: 850px;
            width: 100%;
            background: rgba(15, 25, 45, 0.65);
            backdrop-filter: blur(14px);
            border-radius: 3rem;
            padding: 2.2rem 2rem 2.8rem;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 550px) {
            .countdown-card {
                padding: 1.5rem 1.2rem 2rem;
                border-radius: 2rem;
            }
        }

        .event-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .event-title {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(120deg, #fff, #c0b7ff, #a390ff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
            display: inline-block;
            margin-bottom: 0.5rem;
        }

        .event-sub {
            font-size: 0.95rem;
            color: #b9c7ff;
            background: rgba(255, 255, 255, 0.1);
            display: inline-block;
            padding: 0.2rem 1.2rem;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            font-weight: 500;
        }

        .target-info {
            margin-top: 1rem;
            font-size: 1.05rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 2rem;
            padding: 0.5rem 1rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            flex-wrap: wrap;
            justify-content: center;
            color: #dfe6ff;
            font-weight: 500;
        }

        .target-info span {
            background: rgba(255, 215, 120, 0.2);
            padding: 0.2rem 0.7rem;
            border-radius: 2rem;
            font-family: monospace;
            font-weight: 600;
            color: #ffeaac;
        }

        .countdown-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.2rem;
            margin: 2rem 0 1.8rem;
        }

        .time-block {
            flex: 1;
            min-width: 110px;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(8px);
            border-radius: 2rem;
            padding: 1.2rem 0.5rem;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .time-block:hover {
            transform: translateY(-6px);
            border-color: rgba(210, 180, 255, 0.6);
            box-shadow: 0 18px 30px rgba(0, 0, 0, 0.3);
            background: rgba(20, 35, 55, 0.7);
        }

        .time-number {
            font-size: 3.8rem;
            font-weight: 800;
            font-family: 'JetBrains Mono', 'Fira Mono', 'Courier New', monospace;
            letter-spacing: 4px;
            background: linear-gradient(145deg, #ffffff, #cddbff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            line-height: 1;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .time-label {
            font-size: 1rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 0.6rem;
            color: #b2c4ff;
            background: rgba(255, 255, 255, 0.05);
            display: inline-block;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            backdrop-filter: blur(2px);
        }

        @media (max-width: 500px) {
            .time-number {
                font-size: 2.6rem;
            }
            .time-block {
                min-width: 70px;
                padding: 0.9rem 0.2rem;
            }
            .time-label {
                font-size: 0.75rem;
                letter-spacing: 1px;
            }
            .countdown-grid {
                gap: 0.8rem;
            }
        }

        .expired-message {
            background: linear-gradient(125deg, #ffd966, #ffb347);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 800;
            font-size: 1.6rem;
            text-align: center;
            margin: 1rem 0;
            letter-spacing: 1px;
            animation: pulseGlow 1.5s infinite;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.7; text-shadow: 0 0 0px gold; }
            100% { opacity: 1; text-shadow: 0 0 8px rgba(255, 200, 0, 0.6); }
        }

        .extra-info {
            text-align: center;
            font-size: 0.85rem;
            color: #93a9ff;
            margin-top: 2rem;
            border-top: 1px dashed rgba(255,255,240,0.2);
            padding-top: 1.2rem;
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            flex-wrap: wrap;
        }

        .extra-info p {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.3rem 1rem;
            border-radius: 60px;
            backdrop-filter: blur(4px);
        }

        .refresh-tip {
            font-size: 0.75rem;
            color: #87a0ff;
        }

        .footer-note {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.7rem;
            color: #6f7dbf;
        }

        @keyframes gentlePop {
            0% { transform: scale(1); }
            100% { transform: scale(1.02); text-shadow: 0 0 5px white; }
        }

        .time-number {
            transition: all 0.1s ease;
        }

        button:focus, div:focus {
            outline: none;
        }
    </style>
</head>
<body>

<div class="countdown-card">
    <div class="event-header">
        <div class="event-title">Pinkoc 二周年生日</div>
        <div class="target-info">
            <span>2026年7月3日 19:00(UTC+8)</span>
        </div>
    </div>

    <div class="countdown-grid" id="countdownGrid">
        <div class="time-block">
            <div class="time-number" id="days">00</div>
            <div class="time-label">天</div>
        </div>
        <div class="time-block">
            <div class="time-number" id="hours">00</div>
            <div class="time-label">时</div>
        </div>
        <div class="time-block">
            <div class="time-number" id="minutes">00</div>
            <div class="time-label">分</div>
        </div>
        <div class="time-block">
            <div class="time-number" id="seconds">00</div>
            <div class="time-label">秒</div>
        </div>
    </div>

<script>
    (function() {
        const TARGET_YEAR = 2026;
        const TARGET_MONTH = 6;
        const TARGET_DAY = 3;
        const TARGET_HOUR_UTC = 11;
        const TARGET_MINUTE = 0;
        const TARGET_SECOND = 0;
        
        const TARGET_TIMESTAMP = Date.UTC(TARGET_YEAR, TARGET_MONTH, TARGET_DAY, TARGET_HOUR_UTC, TARGET_MINUTE, TARGET_SECOND);
        
        const daysElement = document.getElementById('days');
        const hoursElement = document.getElementById('hours');
        const minutesElement = document.getElementById('minutes');
        const secondsElement = document.getElementById('seconds');
        const statusMessageDiv = document.getElementById('statusMessage');
        const countdownGrid = document.getElementById('countdownGrid');
        
        let timerInterval = null;
        let isExpiredFlag = false;
        
        function padZero(num) {
            return num < 10 ? '0' + num : String(num);
        }
        
        function updateCountdown() {
            const now = Date.now();
            const diff = TARGET_TIMESTAMP - now;
            
            if (diff <= 0) {
                if (!isExpiredFlag) {
                    isExpiredFlag = true;
                    if (timerInterval) {
                        clearInterval(timerInterval);
                        timerInterval = null;
                    }
                    daysElement.innerText = '00';
                    hoursElement.innerText = '00';
                    minutesElement.innerText = '00';
                    secondsElement.innerText = '00';
                    
                    statusMessageDiv.innerHTML = `
                        <div class="expired-message">
                            🎉 倒计时已结束！ 🎉<br>
                            <span style="font-size: 1rem; color: #ffe6b3;">Pinkoc 二周年生日已到来！</span>
                        </div>
                        <div style="font-size:0.9rem; margin-top:8px; color:#ffda99;">前往Pinkoc参加二周年活动！</div>
                    `;
                    countdownGrid.style.opacity = '0.9';
                }
                return;
            }
            
            if (isExpiredFlag) {
                isExpiredFlag = false;
                statusMessageDiv.innerHTML = '';
                countdownGrid.style.opacity = '1';
            }
            
            const totalSeconds = Math.floor(diff / 1000);
            const days = Math.floor(totalSeconds / 86400);
            const hours = Math.floor((totalSeconds % 86400) / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            
            daysElement.innerText = days.toString();
            hoursElement.innerText = padZero(hours);
            minutesElement.innerText = padZero(minutes);
            secondsElement.innerText = padZero(seconds);
            
            if (statusMessageDiv.innerHTML.includes('倒计时已结束') === false && statusMessageDiv.innerHTML !== '') {
            }
            if (!statusMessageDiv.innerHTML || statusMessageDiv.innerHTML.length < 20) {
                if (!statusMessageDiv.innerHTML.includes('已结束')) {
                    // If the countdown is still active, show a fun message based on how much time is left:)
                    if (days > 365) {
                        statusMessageDiv.innerHTML = '<div style="font-size:0.85rem; background:rgba(255,255,180,0.1); display:inline-block; padding:0.2rem 1rem; border-radius:40px;">🌟 漫长时间里的期待，每一天都珍贵 🌟</div>';
                    } else if (days > 100) {
                        statusMessageDiv.innerHTML = '<div style="font-size:0.85rem; opacity:0.9;">原神牛逼</div>';
                    } else if (days <= 30 && days > 0) {
                        statusMessageDiv.innerHTML = '<div style="font-size:0.9rem; color:#ffdd88;">原神牛逼</div>';
                    } else {
                        statusMessageDiv.innerHTML = '<div style="font-size:0.8rem;"><span>原神牛逼</span></div>';
                    }
                }
            }
        }
        
        function startCountdown() {
            updateCountdown();
            if (isExpiredFlag) return;
            
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (isExpiredFlag) {
                    if (timerInterval) clearInterval(timerInterval);
                    timerInterval = null;
                    return;
                }
                updateCountdown();
                if (isExpiredFlag && timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
            }, 1000);
        }
        
        let visibilityIntervalCheck = null;
        function revalidateTimer() {
            if (!isExpiredFlag && !timerInterval) {
                startCountdown();
            } else if (!isExpiredFlag && timerInterval) {
            }
        }
        
        function handleVisibilityChange() {
            if (document.hidden) {
                return;
            } else {
                if (!isExpiredFlag) {
                    updateCountdown();
                    if (!timerInterval && !isExpiredFlag) {
                        startCountdown();
                    }
                } else {
                    if (timerInterval) {
                        clearInterval(timerInterval);
                        timerInterval = null;
                    }
                }
            }
        }
        
        function cleanUp() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            if (visibilityIntervalCheck) {
                clearInterval(visibilityIntervalCheck);
                visibilityIntervalCheck = null;
            }
            document.removeEventListener('visibilitychange', handleVisibilityChange);
        }
        
        function watchdogTimer() {
            if (!isExpiredFlag && !timerInterval) {
                startCountdown();
            } else if (!isExpiredFlag && timerInterval) {
                updateCountdown();
            } else if (isExpiredFlag && timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }
        
        function init() {
            startCountdown();
            document.addEventListener('visibilitychange', handleVisibilityChange);
            setInterval(() => {
                if (!isExpiredFlag && !timerInterval) {
                    startCountdown();
                } else if (!isExpiredFlag && timerInterval) {
                    updateCountdown();
                } else if (isExpiredFlag && timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
            }, 30000);
            
            window.addEventListener('beforeunload', () => {
                if (timerInterval) clearInterval(timerInterval);
            });
        }
        
        init();
        
        console.log(`${TARGET_TIMESTAMP}`);
        
        const originalUpdate = updateCountdown;
        window.updateCountdown = originalUpdate;
        
        const enhancedUpdate = function() {
            originalUpdate();
            if (!isExpiredFlag) {
                const blocks = document.querySelectorAll('.time-number');
                blocks.forEach(block => {
                    block.style.animation = 'gentlePop 0.2s ease-out';
                    setTimeout(() => {
                        if (block) block.style.animation = '';
                    }, 200);
                });
            }
        };
        
        window.updateCountdown = enhancedUpdate;
        window.updateCountdown = enhancedUpdate;
        enhancedUpdate();
    })();
</script>
</body>
</html>
