<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pinkoc Global Nodes😭</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
        }

        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .map-toggle-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            border-radius: 48px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            padding: 6px;
            display: flex;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            font-size: 14px;
            font-weight: 500;
        }

        .toggle-btn {
            background: transparent;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            color: #2c3e50;
            letter-spacing: 0.5px;
        }

        .toggle-btn:hover {
            background: rgba(0, 0, 0, 0.08);
            transform: scale(0.96);
        }

        .toggle-btn.active {
            background: #2c6e9e;
            color: white;
            box-shadow: 0 2px 8px rgba(44,110,158,0.3);
        }

        .info-credit {
            position: absolute;
            bottom: 12px;
            left: 12px;
            z-index: 1000;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(4px);
            color: #f0f0f0;
            padding: 5px 14px;
            border-radius: 24px;
            font-size: 12px;
            font-family: monospace;
            pointer-events: none;
            font-weight: 500;
        }

        .custom-popup .leaflet-popup-content-wrapper {
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            background: rgba(255, 255, 255, 0.98);
            padding: 0px;
            border-left: 5px solid #2c6e9e;
        }
        .custom-popup .leaflet-popup-tip {
            background: rgba(255, 255, 255, 0.98);
        }
        
        .custom-div-icon {
            transition: transform 0.15s ease, filter 0.1s;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }
        .custom-div-icon:hover {
            transform: scale(1.1);
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.4));
            cursor: pointer;
            z-index: 1000;
        }

        @media (max-width: 640px) {
            .toggle-btn {
                padding: 5px 12px;
                font-size: 12px;
            }
            .map-toggle-panel {
                top: 12px;
                right: 12px;
                gap: 4px;
            }
            .info-credit {
                font-size: 10px;
                bottom: 8px;
                left: 8px;
            }
        }
    </style>
</head>
<body>
<div id="map"></div>

<div class="map-toggle-panel">
    <button id="btn-osm" class="toggle-btn active">🌍 OpenStreetMap</button>
    <button id="btn-gaode" class="toggle-btn">🇨🇳 Amap</button>
</div>
<div class="info-credit">
    Pinkoc Global Nodes😭
</div>

<script>
    const map = L.map('map').setView([20, 0], 2);
    
    const osmTileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> 貢獻者',
        subdomains: 'abc',
        maxZoom: 19,
        minZoom: 1
    });
    
    const gaodeTileLayer = L.tileLayer('https://webrd01.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
        attribution: '&copy; <a href="https://www.amap.com/">Amap</a> GS(2024)1232號',
        maxZoom: 18,
        minZoom: 1,
    });
    
    let currentBaseLayer = osmTileLayer;
    currentBaseLayer.addTo(map);
    
    const markersLayer = L.layerGroup().addTo(map);
    
    function getMinecraftIcon() {
        const svgMarkup = `
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
                <rect width="32" height="32" fill="#6B5E3A" rx="3" ry="3"/>
                <rect x="2" y="2" width="28" height="12" fill="#73A353" rx="2" ry="2"/>
                <rect x="2" y="14" width="28" height="16" fill="#8BB56A" rx="2" ry="2"/>
                <circle cx="8" cy="8" r="1.5" fill="#5A8040" opacity="0.8"/>
                <circle cx="20" cy="6" r="1.5" fill="#5A8040" opacity="0.8"/>
                <circle cx="26" cy="11" r="1.5" fill="#8FBF5E" opacity="0.9"/>
                <circle cx="14" cy="10" r="1.2" fill="#4C6B34"/>
                <circle cx="5" cy="18" r="1.5" fill="#6B8C45"/>
                <circle cx="24" cy="22" r="1.5" fill="#6B8C45"/>
                <circle cx="12" cy="26" r="1.5" fill="#5A7A3A"/>
                <circle cx="28" cy="28" r="1" fill="#9BCA6F"/>
                <rect x="10" y="4" width="3" height="2" fill="#CBE896" opacity="0.7"/>
                <rect x="22" y="8" width="2" height="2" fill="#CBE896" opacity="0.7"/>
                <rect x="16" y="16" width="3" height="2" fill="#CBE896" opacity="0.6"/>
                <rect width="32" height="32" fill="none" stroke="#4A3E2C" stroke-width="1.2" rx="3"/>
            </svg>
        `;
        const iconHtml = `<div style="background: transparent; display: flex; align-items: center; justify-content: center;">${svgMarkup}</div>`;
        return L.divIcon({
            className: 'custom-div-icon',
            html: iconHtml,
            iconSize: [32, 32],
            popupAnchor: [0, -16],
            tooltipAnchor: [0, -16]
        });
    }
    
    function getWebIcon() {
        const html = `
            <div style="
                background: linear-gradient(135deg, #3b82f6, #1e40af);
                border-radius: 50%;
                width: 34px;
                height: 34px;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 0 2px 8px rgba(0,0,0,0.25);
                border: 2px solid white;
                font-size: 22px;
            ">
                🌐
            </div>
        `;
        return L.divIcon({
            className: 'custom-div-icon',
            html: html,
            iconSize: [34, 34],
            popupAnchor: [0, -17],
        });
    }
    
    function getDownloadIcon() {
        const html = `
            <div style="
                background: linear-gradient(145deg, #b0bec5, #78909c);
                border-radius: 50%;
                width: 34px;
                height: 34px;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 0 2px 8px rgba(0,0,0,0.25);
                border: 2px solid white;
                font-size: 22px;
            ">
                ☁️
            </div>
        `;
        return L.divIcon({
            className: 'custom-div-icon',
            html: html,
            iconSize: [34, 34],
            popupAnchor: [0, -17],
        });
    }
    
    function getIconByServiceType(serviceType) {
        if (serviceType === 'minecraft') return getMinecraftIcon();
        if (serviceType === 'web') return getWebIcon();
        if (serviceType === 'download') return getDownloadIcon();
        return getWebIcon();
    }
    
    const globalNodes = [
        {
            city: "鎮江", country: "中國江蘇", lat: 32.2044, lng: 119.4550,
            role: "Pinkoc Main Server😱",
            details: "Minecraft Main Server😱",
            project: "PmC",
            serviceType: "minecraft"
        },
        {
            city: "廣州", country: "中國廣東", lat: 23.1291, lng: 113.2644,
            role: "Pinkoc Acceleration Node😭",
            details: "Minecraft Acceleration Node😭",
            project: "PmCap",
            serviceType: "minecraft"
        },
        {
            city: "武漢", country: "中國湖北", lat: 30.5928, lng: 114.3055,
            role: "Pinkoc Acceleration Node😭",
            details: "Minecraft Acceleration Node😭",
            project: "PmCap",
            serviceType: "minecraft"
        },
        // ========== 香港節點 - 已修正坐標 ==========
        {
            city: "香港", country: "中國香港", lat: 22.3193, lng: 114.1694,
            role: "Pinkoc Acceleration Node😭",
            details: "Minecraft Acceleration Node😭",
            project: "PmCap",
            serviceType: "minecraft"
        },
        {
            city: "香港", country: "中國香港", lat: 22.3198, lng: 114.1699,
            role: "PinWeb CDN🤔",
            details: "PinWeb CDN🤔",
            project: "PwCDN",
            serviceType: "web"
        },
        {
            city: "香港", country: "中國香港", lat: 22.3188, lng: 114.1689,
            role: "PinFiles CDN🤔",
            details: "PinFiles CDN🤔",
            project: "PfCDN",
            serviceType: "download"
        },
        // =========================================
        {
            city: "紐約", country: "美國", lat: 40.6128, lng: -74.0060,
            role: "PinWeb CDN🤔",
            details: "PinWeb CDN🤔",
            project: "PwCDN",
            serviceType: "web"
        },
        {
            city: "紐約", country: "美國", lat: 40.7130, lng: -74.0100,
            role: "PinFiles CDN🤔",
            details: "PinFiles CDN🤔",
            project: "PfCDN",
            serviceType: "download"
        },
        {
            city: "東京", country: "日本", lat: 35.6895, lng: 139.6917,
            role: "Pinkoc Acceleration Node😭",
            details: "Minecraft Acceleration Node😭",
            project: "PmCap",
            serviceType: "minecraft"
        },
        {
            city: "紐約", country: "美國", lat: 40.8138, lng: -74.0160,
            role: "Clash😨",
            details: "Proxy for _Menf_😎",
            project: "AmPf",
            serviceType: "web"
        },
        {
            city: "舊金山", country: "美國", lat: 37.7749, lng: -122.4194,
            role: "PinFiles CDN🤔",
            details: "PinFiles CDN🤔",
            project: "PfCDN",
            serviceType: "download"
        }
    ];
    
    globalNodes.forEach(node => {
        const customIcon = getIconByServiceType(node.serviceType);
        const marker = L.marker([node.lat, node.lng], {
            icon: customIcon,
            title: `${node.city}, ${node.country} - ${node.serviceType === 'minecraft' ? '🎮 Minecraft伺服器' : (node.serviceType === 'web' ? '🌐 網站服務' : '☁️ 下載服務')}`,
            riseOnHover: true
        });
        
        let serviceBadge = '';
        if (node.serviceType === 'minecraft') serviceBadge = 'Pinkoc';
        else if (node.serviceType === 'web') serviceBadge = 'PinWeb';
        else serviceBadge = 'PinFiles';
        
        const popupContent = `
            <div style="min-width: 230px; max-width: 280px; font-family: 'Segoe UI', system-ui;">
                <div style="display: flex; align-items: center; gap: 8px; border-bottom: 2px solid #2c6e9e; margin-bottom: 8px; padding-bottom: 6px;">
                    <span style="font-size: 24px;">📍</span>
                    <span style="font-weight: 800; font-size: 18px; color: #1e4663;">${node.city}</span>
                    <span style="font-size: 13px; color: #4a627a;">${node.country}</span>
                </div>
                <div style="margin: 6px 0;">
                    <span style="background: #eef2f7; padding: 3px 12px; border-radius: 24px; font-size: 12px; font-weight: bold; color: #2c6e9e; display: inline-block;">${node.role}</span>
                </div>
                <div style="margin: 6px 0;">
                    <span style="background: #f0f4c3; padding: 2px 10px; border-radius: 16px; font-size: 11px; font-weight: 600;">${serviceBadge}</span>
                </div>
                <div style="font-size: 13px; color: #2c3e50; line-height: 1.45; margin: 8px 0;">
                    <strong></strong> ${node.project}<br>
                    <strong></strong> ${node.details}
                </div>
                <div style="margin-top: 6px; font-size: 11px; color: #5e7a93; border-top: 1px solid #e2e8f0; padding-top: 5px; display: flex; justify-content: space-between;">
                    <span></span>
                    <span></span>
                </div>
            </div>
        `;
        
        marker.bindPopup(popupContent, {
            maxWidth: 300,
            minWidth: 240,
            className: 'custom-popup'
        });
        
        marker.addTo(markersLayer);
    });
    
    const bounds = L.latLngBounds(globalNodes.map(node => [node.lat, node.lng]));
    map.fitBounds(bounds, { padding: [45, 45] });
    
    setTimeout(() => {
        map.invalidateSize();
    }, 200);
    
    const btnOsm = document.getElementById('btn-osm');
    const btnGaode = document.getElementById('btn-gaode');
    
    function switchToOsm() {
        if (currentBaseLayer === osmTileLayer) return;
        map.removeLayer(currentBaseLayer);
        osmTileLayer.addTo(map);
        currentBaseLayer = osmTileLayer;
        btnOsm.classList.add('active');
        btnGaode.classList.remove('active');
    }
    
    function switchToGaode() {
        if (currentBaseLayer === gaodeTileLayer) return;
        map.removeLayer(currentBaseLayer);
        gaodeTileLayer.addTo(map);
        currentBaseLayer = gaodeTileLayer;
        btnGaode.classList.add('active');
        btnOsm.classList.remove('active');
    }
    
    btnOsm.addEventListener('click', switchToOsm);
    btnGaode.addEventListener('click', switchToGaode);
    
    document.querySelector('.map-toggle-panel').addEventListener('click', (e) => e.stopPropagation());
    
    window.addEventListener('resize', () => {
        if (map) map.invalidateSize();
    });
    
    if ('ontouchstart' in window) {
        map.dragging.enable();
        map.tap && map.tap.enable();
    }

    const mcCount = globalNodes.filter(n => n.serviceType === 'minecraft').length;
    const webCount = globalNodes.filter(n => n.serviceType === 'web').length;
    const dlCount = globalNodes.filter(n => n.serviceType === 'download').length;
    const infoDiv = document.querySelector('.info-credit');
    if (infoDiv) {
        infoDiv.innerHTML = `🧩 Pinkoc · 總計${globalNodes.length}個節點 | 🟩Minecraft:${mcCount}  🌐網站:${webCount}  ☁️下載:${dlCount}`;
    }

    console.log(`地圖載入完成，包含 ${globalNodes.length} 個項目節點。Minecraft:${mcCount}, 網站:${webCount}, 下載:${dlCount}`);
</script>
</body>
</html>
